# Staging overlay: HTTPS via Caddy, production-ish env, shared media volume.
#
# Usage (on the staging VM):
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml \
#     --env-file .env.staging up --build -d
#
# See docs/staging-deploy.md for the full walkthrough.

services:
  api:
    # Keep the migrate-on-startup command from the Dockerfile (the base
    # file's `command:` override would skip migrations).
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.staging}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${STAGING_DOMAIN:?set STAGING_DOMAIN in .env.staging}
      DATABASE_URL: postgres://signseen:signseen@db:5432/signseen
      FRONTEND_URL: https://${STAGING_DOMAIN}
      # Billing (issue #36 follow-up): without these passthroughs the
      # Stripe values in .env.staging never reach the app.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_PRICE_ID_MONTHLY: ${STRIPE_PRICE_ID_MONTHLY:-}
      STRIPE_PRICE_ID_ANNUAL: ${STRIPE_PRICE_ID_ANNUAL:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PREMIUM_STORAGE_BYTES: ${PREMIUM_STORAGE_BYTES:-}
      # Transactional email (same gap: the .env.staging.example values
      # were documented but not wired through).
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    volumes:
      - ./backend:/app
      - media:/app/media
    restart: unless-stopped

  web:
    environment:
      NEXT_PUBLIC_API_URL: https://${STAGING_DOMAIN}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_GHL_CHAT_WIDGET_ID: ${NEXT_PUBLIC_GHL_CHAT_WIDGET_ID:-}
    restart: unless-stopped

  db:
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?set STAGING_DOMAIN in .env.staging}
    restart: unless-stopped
    depends_on:
      - api
      - web

volumes:
  media:
  caddy_data:
  caddy_config:
