name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install LibreOffice (DOCX->PDF conversion, mirrors Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Run tests
        run: cd backend && python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run tests
        run: cd frontend && npm test
      - name: Build
        run: cd frontend && npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Start the test stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/health/ >/dev/null && curl -sf http://localhost:3000 >/dev/null && break
            sleep 5
          done
          curl -sf http://localhost:8000/api/health/
          curl -sf http://localhost:3000 >/dev/null
      - name: Seed E2E fixtures
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T api python manage.py seed_e2e
      - name: Run Playwright suite
        working-directory: e2e
        env:
          E2E_MAILPIT_URL: http://localhost:8025
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/playwright-report
            e2e/screenshots
            e2e/test-results
          if-no-files-found: ignore
      - name: Tear down the test stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
