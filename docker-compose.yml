services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: signseen
      POSTGRES_PASSWORD: signseen
      POSTGRES_DB: signseen
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signseen"]
      interval: 5s
      retries: 5

  api:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://signseen:signseen@db:5432/signseen
      DJANGO_SECRET_KEY: dev-only-secret-key-change-me
      DJANGO_DEBUG: "1"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
