# Test override: mail capture + E2E fixture seeding for the Playwright
# suite in e2e/. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d
#   docker compose -f docker-compose.yml -f docker-compose.test.yml exec api python manage.py seed_e2e
# Mailpit UI/API: http://localhost:8025 (SMTP on 1025, internal).
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    environment:
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "0"
      ENABLE_E2E_FIXTURES: "1"
      # Stripe test-mode keys, passed through only when the shell sets
      # them (billing.spec.ts gates its full flow on the same vars).
      # Empty here = billing unconfigured, which is what CI runs.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_MONTHLY: ${STRIPE_PRICE_ID_MONTHLY:-}
      STRIPE_PRICE_ID_ANNUAL: ${STRIPE_PRICE_ID_ANNUAL:-}
